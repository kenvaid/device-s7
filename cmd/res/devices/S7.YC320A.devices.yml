deviceList:
  - name: bd001
    profileName: BD-YC320A-S7-Profile
    description: "一川机械编切机YC320A"
    labels:
      - "编切机"
    protocols:
      s7:
        Host: 192.168.128.1
        Port: 18080
        Rack: 0
        Slot: 1
        Timeout: 10
        IdleTimeout: 30
    autoEvents:
